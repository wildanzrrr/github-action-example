services:
  postgres:
    image: postgres:17-alpine
    container_name: be_postgres
    restart: unless-stopped
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - be_network
    command:
      [
        'postgres',
        '-c',
        'log_statement=all',
        '-c',
        'log_destination=stderr',
        '-c',
        'log_min_messages=info',
        '-c',
        'max_connections=100',
        '-c',
        'shared_buffers=256MB',
        '-c',
        'effective_cache_size=1GB',
        '-c',
        'maintenance_work_mem=64MB',
        '-c',
        'checkpoint_completion_target=0.9',
        '-c',
        'wal_buffers=16MB',
        '-c',
        'default_statistics_target=100',
      ]

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    image: --built-image--
    container_name: be_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - be_network
    ports:
      - '${PORT:-4000}:3000'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
    driver: local

networks:
  be_network:
    driver: bridge
    internal: false
